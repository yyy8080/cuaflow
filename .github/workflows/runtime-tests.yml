name: tests
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test,build]" ruff
      - run: playwright install --with-deps chromium
      - run: ruff check --select F,E9 src tests
      - run: pytest -q
      - run: python -m build
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[win,test]"
      - run: playwright install chromium
      - name: Windows desktop smoke (Notepad via UIA)
        run: pytest -q -m windows tests/platform
      - name: Regular suite
        run: pytest -q
