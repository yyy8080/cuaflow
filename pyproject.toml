[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuaflow"
version = "0.1.0"
description = "cuaflow: browser + Windows desktop agent that records step-based reusable flows, supervised and self-repairing at runtime (fork of microsoft/CUAWright)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "playwright>=1.45",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mss>=9.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
win = [
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "uiautomation>=2.0.18; sys_platform == 'win32'",
    "pyautogui>=0.9.54; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "openpyxl>=3.1",
    "psutil>=5.9",
]
test = ["pytest>=8", "pytest-timeout>=2.3"]
build = ["build>=1", "wheel"]

[project.scripts]
cuaflow = "cuaflow.cli:main"
cuaflow-desktop = "cuaflow.desktop:main"
cuaflow-tool = "cuaflow.platform.cli_tools:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cuaflow*"]

[tool.setuptools.package-data]
"cuaflow" = ["config/*.yaml", "agents/prompts/*.md", "server/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows: requires a real Windows desktop session",
    "live_llm: requires a real LLM API key",
    "browser: requires Playwright chromium",
]
addopts = "-m 'not windows and not live_llm'"
timeout = 300
